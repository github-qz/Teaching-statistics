<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correlation Coefficient Explorer</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --grid: #e5e7eb;
    --axis: #374151;
    --point: #2563eb;
    --line: #dc2626;
    --panel: #f8fafc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 900px;
    margin: 28px auto;
    padding: 0 22px 28px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  .subtitle {
    margin: 0 0 22px;
    color: var(--muted);
    line-height: 1.45;
  }
  .controls {
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--grid);
    border-radius: 12px;
    margin-bottom: 18px;
  }
  .control-row {
    display: grid;
    grid-template-columns: 185px 1fr 82px;
    gap: 14px;
    align-items: center;
  }
  label {
    font-weight: 600;
  }
  input[type="range"] {
    width: 100%;
  }
  .value {
    font-size: 22px;
    font-weight: 700;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .ticks {
    display: flex;
    justify-content: space-between;
    margin: 7px 90px 0 199px;
    color: var(--muted);
    font-size: 12px;
  }
  .chart-wrap {
    width: 100%;
    aspect-ratio: 1.55 / 1;
    min-height: 400px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border: 1px solid var(--grid);
    border-radius: 10px;
    background: #fff;
  }
  .footer {
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
  }
  @media (max-width: 650px) {
    .control-row {
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .value { text-align: left; }
    .ticks { margin: 7px 0 0; }
    .chart-wrap { min-height: 330px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Correlation Coefficient Explorer</h1>
  <p class="subtitle">
    Move the slider to change the target correlation. The scatter plot updates while
    preserving the same underlying random sample, and the red line is the least-squares
    regression line for the displayed points.
  </p>

  <div class="controls">
    <div class="control-row">
      <label for="rho">Correlation Coefficient</label>
      <input id="rho" type="range" min="-1" max="1" step="0.01" value="0">
      <div class="value" id="rhoValue">0.00</div>
    </div>
    <div class="ticks">
      <span>−1</span>
      <span>−0.5</span>
      <span>0</span>
      <span>0.5</span>
      <span>1</span>
    </div>
  </div>

  <div class="chart-wrap">
    <canvas id="plot"></canvas>
  </div>
</div>

<script>
(() => {
  const slider = document.getElementById('rho');
  const rhoValue = document.getElementById('rhoValue');
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');

  const N = 60;

  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const rng = mulberry32(20260819);

  function normal() {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function standardize(arr) {
    const mean = arr.reduce((a,b) => a+b, 0) / arr.length;
    const centered = arr.map(v => v - mean);
    const ss = Math.sqrt(centered.reduce((a,b) => a+b*b, 0));
    return centered.map(v => v / ss);
  }

  let x = standardize(Array.from({length:N}, normal));
  let z0 = standardize(Array.from({length:N}, normal));

  // Orthogonalize z to x so the generated sample correlation is exactly rho
  const dotXZ = x.reduce((s, xi, i) => s + xi * z0[i], 0);
  let z = z0.map((zi, i) => zi - dotXZ * x[i]);
  z = standardize(z);

  function makeData(rho) {
    const s = Math.sqrt(Math.max(0, 1 - rho*rho));
    const y = x.map((xi, i) => rho * xi + s * z[i]);
    return x.map((xi, i) => ({x: xi, y: y[i]}));
  }

  function corr(data) {
    const mx = data.reduce((s,p)=>s+p.x,0)/data.length;
    const my = data.reduce((s,p)=>s+p.y,0)/data.length;
    let sxx=0, syy=0, sxy=0;
    for (const p of data) {
      const dx=p.x-mx, dy=p.y-my;
      sxx += dx*dx; syy += dy*dy; sxy += dx*dy;
    }
    return sxy / Math.sqrt(sxx*syy);
  }

  function regression(data) {
    const mx = data.reduce((s,p)=>s+p.x,0)/data.length;
    const my = data.reduce((s,p)=>s+p.y,0)/data.length;
    let sxx=0, sxy=0;
    for (const p of data) {
      sxx += (p.x-mx)*(p.x-mx);
      sxy += (p.x-mx)*(p.y-my);
    }
    const b = sxy/sxx;
    const a = my - b*mx;
    return {a,b};
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width*dpr);
    canvas.height = Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function draw() {
    resizeCanvas();
    const rho = Number(slider.value);
    rhoValue.textContent = rho.toFixed(2);

    const data = makeData(rho);

    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    ctx.clearRect(0,0,W,H);

    const m = {left:58,right:24,top:24,bottom:52};
    const pw = W-m.left-m.right;
    const ph = H-m.top-m.bottom;

    const limit = 0.48;
    const minVal = -limit, maxVal = limit;

    const sx = v => m.left + (v-minVal)/(maxVal-minVal)*pw;
    const sy = v => m.top + ph - (v-minVal)/(maxVal-minVal)*ph;

    // grid
    ctx.lineWidth = 1;
    ctx.strokeStyle = "#e5e7eb";
    ctx.fillStyle = "#6b7280";
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";

    const ticks = [-0.4,-0.2,0,0.2,0.4];
    ticks.forEach(t => {
      const px = sx(t);
      const py = sy(t);
      ctx.beginPath(); ctx.moveTo(px,m.top); ctx.lineTo(px,m.top+ph); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(m.left,py); ctx.lineTo(m.left+pw,py); ctx.stroke();
    });

    // axes
    ctx.strokeStyle = "#374151";
    ctx.lineWidth = 1.25;
    ctx.strokeRect(m.left,m.top,pw,ph);

    // labels
    ctx.fillStyle = "#1f2937";
    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("x", m.left+pw/2, H-8);
    ctx.save();
    ctx.translate(16,m.top+ph/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText("y",0,0);
    ctx.restore();

    // regression line
    const reg = regression(data);
    const x1=minVal, x2=maxVal;
    const y1=reg.a+reg.b*x1, y2=reg.a+reg.b*x2;
    ctx.strokeStyle = "#dc2626";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(sx(x1), sy(y1));
    ctx.lineTo(sx(x2), sy(y2));
    ctx.stroke();

    // points
    ctx.fillStyle = "#2563eb";
    for (const p of data) {
      ctx.beginPath();
      ctx.arc(sx(p.x),sy(p.y),4,0,Math.PI*2);
      ctx.fill();
    }
  }

  slider.addEventListener('input', draw);
  window.addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
